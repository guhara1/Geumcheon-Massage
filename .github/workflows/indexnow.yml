name: Search engine indexing notify

# 페이지/사이트맵/RSS가 바뀌어 푸시될 때마다 검색엔진에 즉시 통보합니다.
#  - IndexNow: 빙·네이버·얀덱스 (시크릿 불필요)
#  - Google Indexing API: GOOGLE_INDEXING_SA 시크릿이 있을 때만 (보조)
#  - 매일 새벽 1회 전체 sitemap 재통보(스케줄)로 누락 방지

on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - 'sitemap.xml'
      - 'rss.xml'
  schedule:
    - cron: '17 18 * * *'   # 매일 KST 03:17 — 전체 재통보
  workflow_dispatch:        # 수동 실행도 허용

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2     # --changed 비교용(직전 커밋 대비)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Cloudflare Pages 배포가 반영될 시간을 잠깐 대기
      - name: Wait for deploy to propagate
        if: github.event_name == 'push'
        run: sleep 90

      - name: IndexNow — changed URLs (push)
        if: github.event_name == 'push'
        run: python3 tools/indexnow.py --changed

      - name: IndexNow — full sitemap (daily / manual)
        if: github.event_name != 'push'
        run: python3 tools/indexnow.py --all

      # ── 선택: Google Indexing API (서비스계정 시크릿이 있을 때만) ──
      - name: Google Indexing API (optional)
        env:
          GOOGLE_INDEXING_SA: ${{ secrets.GOOGLE_INDEXING_SA }}
        if: env.GOOGLE_INDEXING_SA != ''
        run: |
          printf '%s' "$GOOGLE_INDEXING_SA" > /tmp/gsa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gsa.json
          python3 -m pip install --quiet google-auth
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 tools/google_indexing.py --changed
          else
            python3 tools/google_indexing.py --all
          fi
          rm -f /tmp/gsa.json
